name: Produce YouTube Short

# Daily at 13:00 UTC (18:30 IST). GitHub cron is always UTC and can run a few
# minutes late. Change the first field for a different hour, or add more cron
# lines for several Shorts per day (history.json prevents topic repeats).
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the video but skip the YouTube upload"
        type: boolean
        default: false
      privacy:
        description: "Privacy override for this run only"
        type: choice
        options:
          - config
          - private
          - unlisted
          - public
        default: config

# Never let two runs write history.json at the same time.
concurrency:
  group: shorts-agent
  cancel-in-progress: false

# Needed to push the updated history.json back to the repository.
permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  produce:
    name: Generate and upload
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache the whisper model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: whisper-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fontconfig fonts-dejavu-core fonts-liberation
          ffmpeg -version | head -n 1

      - name: Install the caption font
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          # Montserrat ExtraBold (SIL Open Font License) for the captions.
          if curl -fsSL --retry 3 --max-time 60 \
            -o "$HOME/.local/share/fonts/Montserrat-ExtraBold.ttf" \
            "https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-ExtraBold.ttf"; then
            echo "Montserrat installed"
          else
            echo "::warning::Montserrat download failed; captions will use a system font fallback"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          fc-list | grep -i montserrat || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate the Short
        id: generate
        # Keep going so a failed run still uploads its artefacts and history.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PRIVACY: ${{ github.event.inputs.privacy || 'config' }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "${PRIVACY}" != "config" ] && [ -n "${PRIVACY}" ]; then
            args+=(--privacy "${PRIVACY}")
          fi
          echo "Running: python main.py ${args[*]:-}"
          python main.py "${args[@]}"

      - name: Upload the video as an artifact (failed runs)
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: output/**
          if-no-files-found: warn
          retention-days: 7

      - name: Mark the job as failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::The pipeline failed. Check the logs above and download the artifact if a video was produced."
          exit 1

      - name: Commit the updated history.json
        if: steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet -- history.json; then
            echo "history.json unchanged (dry run?) - nothing to commit"
            exit 0
          fi

          git config user.name "shorts-agent[bot]"
          git config user.email "shorts-agent@users.noreply.github.com"
          git add history.json
          git commit -m "chore(history): record the Short published on $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed history.json to ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing and retrying"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done

          echo "::error::Could not push history.json. Check the workflow permissions (contents: write) and branch protection rules."
          exit 1
